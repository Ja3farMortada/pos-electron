<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock</title>
    <link
        rel="stylesheet"
        href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="printStyle.css" />
    <!-- Vue Installed from npm -->
    <script src="../node_modules/vue/dist/vue.global.prod.js"></script>
</head>
<body>
<div id="app" class="container-fluid">
    <table class="table table-sm table-bordered text-center">
        <thead>
            <tr>
                <th>#</th>
                <th>SKU</th>
                <th>Description</th>
                <th>Category</th>
                <th>Qty</th>
                <!-- <th>Avg Cost</th> -->
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr v-for="(record, index) in records" :key="index">
                <td>{{ index + 1 }}</td>
                <td>{{ record.sku || '---' }}</td>
                <td>{{ record.product_name }}</td>
                <td>{{ record.category_name || '---' }}</td>
                <td>{{ record.quantity || '---' }}</td>
                <!-- <td>{{ record.average_cost_usd | currency }}</td> -->
                <td v-if="record.currency === 'dollar'">
                    {{ formatCurrency(record.unit_price_usd) }}
                </td>
                <td v-if="record.currency === 'lira'">
                    {{ formatLira(record.unit_price_usd) }}
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script>
const { createApp, ref } = Vue;

createApp({
    setup() {
        const records = ref([]);

        function formatCurrency(val) {
            if (!val) return '$0.00';
            return Number(val).toLocaleString(undefined, {
                style: 'currency',
                currency: 'USD'
            });
        }

        function formatLira(val) {
            if (!val) return '0 L.L';
            return Number(val).toLocaleString() + ' L.L';
        }

        if (window.electron) {
            window.electron.print((event, data) => {
                // data is expected to be an array of records
                records.value = Array.isArray(data) ? data : [];
            });
        }

        return {
            records,
            formatCurrency,
            formatLira
        };
    }
}).mount('#app');
</script>

</body>
</html>
