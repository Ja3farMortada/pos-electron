<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Print</title>
    <link
        rel="stylesheet"
        href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <!-- Vue Installed from npm -->
    <script src="../node_modules/vue/dist/vue.global.prod.js"></script>
    <script src="../node_modules/jsbarcode/dist/JsBarcode.all.min.js"></script>

    <style>
        @page {
            margin: 0;
            /* size: 80mm, auto; */
            size: 1.5in 1in;
        }
        body {
            /* width: 70mm; */
            margin: 0;
            padding: 0;
            /* font-size: 12px; */
        }
        body {
            width: 2in;
            height: 1in;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .print-section {
            width: 100%; /* Ensure receipt content fits the page width */
            /* padding: 5mm; */
        }
        #barcode {
            width: 100%;
            height: 1.2in;
        }
    </style>
</head>
<body>
<div id="app" class="print-section">
    <!-- thank msg -->
    <!-- <p>Thank you for choosing us.</p> -->
    <svg id="barcode"></svg>
    <h6 class="m-0 text-center" v-if="label.shortName">{{ label.shortName }}</h6>
    <h6 class="m-0 text-center" v-if="label.price">
        {{ formatCurrency(label.price) }}
    </h6>
</div>

<script>
const { createApp, reactive } = Vue;

createApp({
    setup() {
        const label = reactive({
            shortName: null,
            price: null,
            barcode: null,
            displayBarcodeValue: true
        });

        function formatCurrency(val) {
            if (!val) return '$0.00';
            return Number(val).toLocaleString(undefined, {
                style: 'currency',
                currency: 'USD'
            });
        }

        function renderBarcode() {
            if (!label.barcode) return;
            JsBarcode("#barcode", label.barcode, {
                format: "CODE128",
                lineColor: "#000000",
                displayValue: label.displayBarcodeValue,
                width: 1.5,
                // height: 200
            });
        }

        if (window.electron) {
            window.electron.print((event, data) => {
                Object.assign(label, data || {});
                renderBarcode();
            });
        }

        return {
            label,
            formatCurrency
        };
    }
}).mount('#app');
</script>
</body>
</html>
